---
name: github-cleanup
on:
  schedule:
    - cron: '30 2 1 * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      dryrun:
        description: dry-run execution, default 'false'
        required: true
        default: false
        type: boolean
env:
  REGISTRY_NAME: ghcr.io
  IMAGE_NAME: kamailio
  REGISTRY_IMAGE: kamailio/kamailio
jobs:
  clean:
    runs-on: [self-hosted, linux, x64, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout actions
        uses: actions/checkout@v7
        with:
          ref: master
          sparse-checkout: |
            .github/actions

      - name: Cleanup ghcr
        uses: ./.github/actions/ghcr-cleaner
        with:
            owner-type: org
            token: ${{ secrets.CLEAN_PACKAGES }}
            delete-untagged: true
            dry-run: ${{ github.event.inputs.dryrun || 'false' }}
